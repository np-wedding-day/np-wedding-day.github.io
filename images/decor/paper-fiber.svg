<?xml version="1.0" encoding="UTF-8"?>
<!-- เนื้อกระดาษ: tile 400x400 ปูซ้ำทั้งแผ่นการ์ด (.sheet)
     ใช้ feTurbulence ล้วน ไม่มีเส้นวาดมือ — เส้นวาดจะซ้ำเป็น pattern ให้ตาจับได้ทันที
     ชั้นบน  = เกรนความถี่สูง → ผิวสัมผัสเนื้อเยื่อกระดาษ
     ชั้นล่าง = คลื่นความถี่ต่ำ → ความไม่สม่ำเสมอของเนื้อกระดาษแบบเบลอๆ
     stitchTiles="stitch" ทำให้ขอบ tile ต่อกันสนิท ไม่เห็นรอยต่อ -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <!-- ความไม่สม่ำเสมอกว้างๆ ของเนื้อกระดาษ -->
    <filter id="pf-mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="12"
        stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>

    <!-- เกรนละเอียด -->
    <filter id="pf-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="5"
        stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="400" height="400" filter="url(#pf-mottle)" opacity="0.05"/>
  <rect width="400" height="400" filter="url(#pf-grain)" opacity="0.04"/>
</svg>
